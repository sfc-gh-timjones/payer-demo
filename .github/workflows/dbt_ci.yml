name: dbt CI/CD — caloptima_dw

# push → dev:          deploy + build --target dev  (keeps live Snowflake tasks current)
# pull_request → main: deploy + dev + qa + prod      (full gate before merging)
# workflow_dispatch:   manual deploy + dev            (demo "deploy now" button)

on:
  push:
    branches: [dev]
    paths:
      - 'caloptima_dw/**'
  pull_request:
    branches: [main]
    paths:
      - 'caloptima_dw/**'
  workflow_dispatch:

# Cancel any in-progress run for the same ref when a new push arrives.
# Prevents stale deploys queueing up when you push repeatedly.
concurrency:
  group: dbt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: always runs (push, PR, or manual) ────────────────────────────────
  deploy-and-dev:
    name: Deploy + dbt build (dev)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: Snowflake-Labs/snowflake-cli-action@v2

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml << EOF
          [connections.ci]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          authenticator = "programmatic_access_token"
          token = "${{ secrets.SNOWFLAKE_PAT }}"
          role = "ACCOUNTADMIN"
          warehouse = "WH_SMALL"
          EOF
          chmod 0600 ~/.snowflake/config.toml

      - name: Deploy dbt project to Snowflake
        run: |
          cd caloptima_dw && snow dbt deploy -c ci \
            --database ANALYTICS_ADMIN --schema PROJECTS \
            caloptima_dw

      - name: dbt build — dev (FACETS_DEV)
        run: |
          snow dbt execute -c ci \
            --database ANALYTICS_ADMIN --schema PROJECTS \
            CALOPTIMA_DW build --target dev

  # ─── Job 2: PR to main only — qa + prod gate ─────────────────────────────────
  qa-and-prod:
    name: dbt build (qa + prod)
    needs: deploy-and-dev
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: Snowflake-Labs/snowflake-cli-action@v2

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml << EOF
          [connections.ci]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          authenticator = "programmatic_access_token"
          token = "${{ secrets.SNOWFLAKE_PAT }}"
          role = "ACCOUNTADMIN"
          warehouse = "WH_SMALL"
          EOF
          chmod 0600 ~/.snowflake/config.toml

      - name: dbt build — qa (FACETS_QA)
        run: |
          snow dbt execute -c ci \
            --database ANALYTICS_ADMIN --schema PROJECTS \
            CALOPTIMA_DW build --target qa

      - name: dbt build — prod (FACETS_PROD)
        run: |
          snow dbt execute -c ci \
            --database ANALYTICS_ADMIN --schema PROJECTS \
            CALOPTIMA_DW build --target prod
