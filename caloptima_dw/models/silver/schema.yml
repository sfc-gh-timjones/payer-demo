version: 2

models:
  - name: provider
    description: >
      SCD2 provider history built on top of the dbt snapshot (SILVER.PROVIDER_SNAPSHOT).
      One row per snapshot version, enriched with current address/network/org data.
      Query with dbt_valid_to IS NULL for current providers.
      Unique key: dbt_scd_id (generated by dbt snapshot).
    columns:
      - name: dbt_scd_id
        description: "Unique row hash generated by dbt snapshot. Stable per version."
        tests: [not_null, unique]
      - name: PRPR_ID
        description: "Natural key from Facets. Multiple rows per PRPR_ID when history exists."
        tests:
          - not_null
          - relationships:
              to: source('raw', 'CMC_PRPR_PROV')
              field: PRPR_ID
      - name: PRPR_NPI
        tests: [not_null]
      - name: PROVIDER_TYPE
        tests:
          - accepted_values:
              values: ['Individual (Type 1)', 'Organization (Type 2)', 'Unknown']
      - name: IS_PCP_ELIGIBLE
        tests: [not_null]
      - name: dbt_valid_from
        description: "Timestamp when this version became active."
        tests: [not_null]
      - name: dbt_valid_to
        description: "Timestamp when superseded. NULL = currently active version."
      - name: BRONZE_UPDATED_AT
        tests: [not_null]

  - name: member
    description: >
      Deduplicated member master (1 row per MEME_ID) enriched with subscriber,
      current PCP, and Medi-Cal attributes. Incremental merge keyed on MEME_ID.
    columns:
      - name: MEME_ID
        tests: [not_null, unique]
      - name: SBSB_ID
        tests:
          - not_null
          - relationships:
              to: source('raw', 'CMC_SBSB_SUBSC')
              field: SBSB_ID
      - name: ACTIVE_PCP_PRPR_ID
        tests:
          - relationships:
              to: source('raw', 'CMC_PRPR_PROV')
              field: PRPR_ID
      - name: BRONZE_UPDATED_AT
        tests: [not_null]
      - name: SILVER_LOADED_AT
        tests: [not_null]

  - name: eligibility
    description: >
      Non-overlapping eligibility spans per member x plan type.
      Incremental re-evaluates all spans for members updated since last run.
    columns:
      - name: MEME_ID
        tests:
          - not_null
          - relationships:
              to: source('raw', 'CMC_MEME_MEMBER')
              field: MEME_ID
      - name: MEPE_PLAN_TYPE
        tests: [not_null]
      - name: SPAN_EFF_DT
        tests: [not_null]
      - name: IS_ACTIVE
        tests: [not_null]
      - name: SILVER_LOADED_AT
        tests: [not_null]
      - name: HAD_OVERLAP
        tests: [not_null]

  - name: rejected_providers
    description: >
      Providers rejected from Silver due to invalid or missing NPI.
      Rebuilt as a full table on every run — rows disappear automatically
      when NPI is corrected in the source system.
      REJECTION_RULE: NPI_NULL or NPI_INVALID.
    columns:
      - name: PRPR_ID
        tests: [not_null, unique]
      - name: REJECTION_RULE
        tests:
          - not_null
          - accepted_values:
              values: ['NPI_NULL', 'NPI_INVALID']
      - name: QUARANTINE_DTM
        tests: [not_null]
